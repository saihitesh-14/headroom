name: Headroom
options:
  bundleIdPrefix: io.github.saihitesh-14
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  HeadroomCore:
    path: Packages/HeadroomCore
targets:
  Headroom:
    type: application
    platform: iOS
    sources:
      - path: App
        type: syncedFolder
    dependencies:
      - package: HeadroomCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.saihitesh-14.headroom
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Headroom
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: Headroom uses Face ID to keep your plan private.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        CODE_SIGN_STYLE: Automatic
  HeadroomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
        type: syncedFolder
    dependencies:
      - target: Headroom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.saihitesh-14.headroom.tests
  HeadroomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
        type: syncedFolder
    dependencies:
      - target: Headroom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.saihitesh-14.headroom.uitests
schemes:
  Headroom:
    build:
      targets:
        Headroom: all
    test:
      targets:
        - HeadroomTests
        - HeadroomUITests
